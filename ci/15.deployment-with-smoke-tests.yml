# Deployment with Smoke Tests - 部署後冒煙測試
#
# ========================================
# 使用情境說明
# ========================================
#
# 這個 Pipeline 展示如何在部署完成後立即執行自動化冒煙測試（Smoke Tests），
# 確保關鍵功能在生產環境中正常運作，並在發現問題時自動回滾。
#
# 什麼是 Smoke Tests？
# - 快速、簡單的測試，檢查系統的基本功能是否正常
# - 通常在 5-10 分鐘內完成
# - 不是完整測試，而是「冒煙檢查」（就像檢查機器有沒有冒煙）
# - 目的是快速發現重大問題，而不是找出所有 bug
#
# 適用場景：
# 1. 生產環境部署後的快速驗證
# 2. 確保關鍵業務流程（登入、結帳、搜尋等）正常運作
# 3. 檢查第三方服務整合（資料庫、API、儲存等）是否正常
# 4. 驗證環境設定（環境變數、連接字串等）是否正確
# 5. 在多環境部署中（Dev → QA → Staging → Prod）快速驗證每個環境
#
# 與其他測試的差異：
# - Unit Tests：開發階段，測試個別函數/方法
# - Integration Tests：測試模組間的整合
# - Smoke Tests：部署後，測試關鍵路徑是否通暢
# - E2E Tests：完整的端到端測試，耗時較長
#
# 優勢：
# - 快速反饋：5-10 分鐘內知道部署是否成功
# - 自動回滾：測試失敗自動觸發回滾機制
# - 降低風險：在用戶發現問題前就能發現並處理
# - 信心保證：確保基本功能正常才完成部署
# - 文件化：測試腳本也是系統關鍵功能的文件
#
# 實際案例：
# - Netflix：部署後自動執行數百個 Smoke Tests
# - Amazon：每次部署都會測試關鍵購物流程
# - Microsoft：Azure 服務部署後的健康檢查
#
# ========================================

trigger:
  - master

variables:
  buildConfiguration: "Release"
  azureSubscription: "Azure Pass - 20210830(b9beff15-1273-439b-bd95-d83efb276249)"
  appName: "demo0830"
  resourceGroupName: "demo-rg"
  # 測試設定
  smokeTestTimeout: 600 # 10 分鐘
  healthCheckRetries: 3
  healthCheckInterval: 10 # 秒

stages:
  - stage: Build
    displayName: "建置階段"
    jobs:
      - job: Build
        displayName: "建置與測試"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: DotNetCoreCLI@2
            displayName: ".NET Restore"
            inputs:
              command: "restore"
              projects: "**/*.csproj"

          - task: DotNetCoreCLI@2
            displayName: ".NET Build"
            inputs:
              command: "build"
              projects: "**/*.csproj"
              arguments: "--configuration $(buildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: "Unit Tests"
            inputs:
              command: "test"
              projects: "**/*UnitTest/*.csproj"
              arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

          - task: DotNetCoreCLI@2
            displayName: "Integration Tests"
            inputs:
              command: "test"
              projects: "**/*IntegrationTest/*.csproj"
              arguments: "--configuration $(buildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: ".NET Publish"
            inputs:
              command: "publish"
              publishWebProjects: true
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)"
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: "發布建置成品"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "drop"

  - stage: DeployToProduction
    displayName: "部署到生產環境"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: "部署應用程式"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: "下載建置成品"
                  inputs:
                    buildType: "current"
                    downloadType: "single"
                    artifactName: "drop"
                    downloadPath: "$(System.ArtifactsDirectory)"

                - task: PowerShell@2
                  displayName: "備份目前版本資訊"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "========================================="
                      Write-Host "部署前準備"
                      Write-Host "========================================="
                      Write-Host "記錄目前版本資訊供回滾使用"
                      Write-Host "Build ID: $(Build.BuildId)"
                      Write-Host "部署時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                      Write-Host ""
                      Write-Host "##vso[task.setvariable variable=DeploymentTime]$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                      Write-Host "##vso[task.setvariable variable=PreviousBuildId;isOutput=true]$(Build.BuildId)"

                - task: AzureWebApp@1
                  displayName: "部署到 Azure Web App"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: "webApp"
                    appName: "$(appName)"
                    package: "$(System.ArtifactsDirectory)/drop/**/*.zip"
                    deploymentMethod: "auto"

                - task: PowerShell@2
                  displayName: "等待應用程式啟動"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "等待應用程式完全啟動..."
                      Write-Host "等待時間: 30 秒"
                      Start-Sleep -Seconds 30
                      Write-Host "✓ 等待完成，開始執行冒煙測試"

  - stage: SmokeTests
    displayName: "冒煙測試 (Smoke Tests)"
    dependsOn: DeployToProduction
    condition: succeeded()
    jobs:
      - job: BasicHealthChecks
        displayName: "基礎健康檢查"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "1. 應用程式存活檢查"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 1: 應用程式存活檢查"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"
                $healthUrl = "$appUrl/health"
                $maxRetries = $(healthCheckRetries)
                $retryInterval = $(healthCheckInterval)

                Write-Host "目標 URL: $healthUrl"
                Write-Host "最大重試次數: $maxRetries"
                Write-Host ""

                $success = $false
                for ($i = 1; $i -le $maxRetries; $i++) {
                    try {
                        Write-Host "嘗試 $i/$maxRetries ..."
                        $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
                        
                        if ($response.StatusCode -eq 200) {
                            Write-Host "✓ 健康檢查通過 (HTTP $($response.StatusCode))"
                            $success = $true
                            break
                        }
                    } catch {
                        Write-Warning "✗ 嘗試 $i 失敗: $_"
                        if ($i -lt $maxRetries) {
                            Write-Host "等待 $retryInterval 秒後重試..."
                            Start-Sleep -Seconds $retryInterval
                        }
                    }
                }

                if (-not $success) {
                    Write-Error "✗ 健康檢查失敗：應用程式無法正常回應"
                    exit 1
                }

                Write-Host ""
                Write-Host "測試結果: 通過 ✓"
                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "2. 首頁載入測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 2: 首頁載入測試"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"
                Write-Host "測試 URL: $appUrl"

                try {
                    $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
                    $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing -TimeoutSec 30
                    $stopwatch.Stop()
                    
                    $responseTime = $stopwatch.ElapsedMilliseconds
                    
                    Write-Host "HTTP 狀態碼: $($response.StatusCode)"
                    Write-Host "響應時間: $responseTime ms"
                    Write-Host "內容長度: $($response.Content.Length) bytes"
                    
                    # 檢查狀態碼
                    if ($response.StatusCode -ne 200) {
                        Write-Error "✗ 首頁回應狀態碼異常: $($response.StatusCode)"
                        exit 1
                    }
                    
                    # 檢查響應時間（警告但不失敗）
                    if ($responseTime -gt 5000) {
                        Write-Warning "⚠ 警告：首頁載入時間過長 ($responseTime ms)"
                    }
                    
                    # 檢查內容是否包含預期的文字
                    if ($response.Content -like '*SimpleWeb*' -or $response.Content.Length -gt 100) {
                        Write-Host "✓ 頁面內容驗證通過"
                    } else {
                        Write-Warning "⚠ 警告：頁面內容可能不完整"
                    }
                    
                    Write-Host ""
                    Write-Host "測試結果: 通過 ✓"
                    
                } catch {
                    Write-Error "✗ 首頁載入失敗: $_"
                    exit 1
                }

                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "3. 隱私頁面測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 3: 隱私頁面測試"
                Write-Host "========================================="

                $privacyUrl = "https://$(appName).azurewebsites.net/Home/Privacy"
                Write-Host "測試 URL: $privacyUrl"

                try {
                    $response = Invoke-WebRequest -Uri $privacyUrl -UseBasicParsing -TimeoutSec 30
                    
                    if ($response.StatusCode -eq 200) {
                        Write-Host "✓ 隱私頁面載入成功 (HTTP $($response.StatusCode))"
                        Write-Host ""
                        Write-Host "測試結果: 通過 ✓"
                    } else {
                        Write-Error "✗ 隱私頁面狀態異常: $($response.StatusCode)"
                        exit 1
                    }
                } catch {
                    Write-Error "✗ 隱私頁面載入失敗: $_"
                    exit 1
                }

                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "4. 靜態資源測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 4: 靜態資源載入測試"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"
                $resources = @(
                    "/css/site.css",
                    "/js/site.js"
                )

                $allPassed = $true

                foreach ($resource in $resources) {
                    $resourceUrl = "$appUrl$resource"
                    Write-Host "測試: $resourceUrl"
                    
                    try {
                        $response = Invoke-WebRequest -Uri $resourceUrl -UseBasicParsing -TimeoutSec 15
                        if ($response.StatusCode -eq 200) {
                            Write-Host "  ✓ 載入成功 ($($response.Content.Length) bytes)"
                        } else {
                            Write-Warning "  ✗ 載入失敗 (HTTP $($response.StatusCode))"
                            $allPassed = $false
                        }
                    } catch {
                        Write-Warning "  ✗ 無法載入: $_"
                        # 靜態資源失敗不一定要中斷部署，視情況決定
                    }
                }

                Write-Host ""
                if ($allPassed) {
                    Write-Host "測試結果: 通過 ✓"
                } else {
                    Write-Warning "測試結果: 部分資源載入失敗"
                }

                Write-Host "========================================="

      - job: FunctionalSmokeTests
        displayName: "功能性冒煙測試"
        dependsOn: BasicHealthChecks
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "5. 資料庫連線測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 5: 資料庫連線測試"
                Write-Host "========================================="

                # 這裡假設有一個 API endpoint 可以測試資料庫連線
                $dbCheckUrl = "https://$(appName).azurewebsites.net/health/database"
                Write-Host "測試 URL: $dbCheckUrl"

                try {
                    # 如果沒有專門的 endpoint，可以測試一個需要資料庫的功能
                    # 這裡用 health endpoint 模擬
                    $response = Invoke-WebRequest -Uri "https://$(appName).azurewebsites.net/health" -UseBasicParsing -TimeoutSec 30
                    
                    Write-Host "✓ 資料庫連線測試通過（模擬）"
                    Write-Host ""
                    Write-Host "實際環境中應該測試："
                    Write-Host "- 資料庫連線是否正常"
                    Write-Host "- 是否能執行簡單的查詢"
                    Write-Host "- 連線池是否正常"
                    Write-Host ""
                    Write-Host "測試結果: 通過 ✓"
                    
                } catch {
                    Write-Error "✗ 資料庫連線測試失敗: $_"
                    exit 1
                }

                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "6. 關鍵業務流程測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 6: 關鍵業務流程測試"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"

                Write-Host "測試關鍵業務流程..."
                Write-Host ""

                # 模擬測試上傳功能頁面
                try {
                    Write-Host "6.1 測試上傳頁面..."
                    $uploadUrl = "$appUrl/Home/Upload"
                    $response = Invoke-WebRequest -Uri $uploadUrl -UseBasicParsing -TimeoutSec 30
                    
                    if ($response.StatusCode -eq 200) {
                        Write-Host "  ✓ 上傳頁面可訪問"
                    } else {
                        Write-Warning "  ✗ 上傳頁面異常"
                    }
                } catch {
                    Write-Warning "  ✗ 上傳頁面無法訪問（可能不存在）"
                }

                Write-Host ""
                Write-Host "實際環境中應該測試："
                Write-Host "- 用戶註冊/登入流程"
                Write-Host "- 購物車加入商品"
                Write-Host "- 搜尋功能"
                Write-Host "- 文件上傳/下載"
                Write-Host "- 支付流程（測試環境）"
                Write-Host ""
                Write-Host "測試結果: 通過 ✓"
                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "7. 效能基準測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 7: 效能基準測試"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"
                $iterations = 10
                $times = @()

                Write-Host "執行 $iterations 次請求測試..."
                Write-Host ""

                for ($i = 1; $i -le $iterations; $i++) {
                    try {
                        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
                        Invoke-WebRequest -Uri $appUrl -UseBasicParsing -TimeoutSec 30 | Out-Null
                        $stopwatch.Stop()
                        
                        $responseTime = $stopwatch.ElapsedMilliseconds
                        $times += $responseTime
                        Write-Host "請求 $i : $responseTime ms"
                    } catch {
                        Write-Warning "請求 $i 失敗"
                    }
                }

                if ($times.Count -gt 0) {
                    $avgTime = ($times | Measure-Object -Average).Average
                    $minTime = ($times | Measure-Object -Minimum).Minimum
                    $maxTime = ($times | Measure-Object -Maximum).Maximum
                    
                    Write-Host ""
                    Write-Host "效能統計："
                    Write-Host "- 平均響應時間: $([math]::Round($avgTime, 2)) ms"
                    Write-Host "- 最快響應: $minTime ms"
                    Write-Host "- 最慢響應: $maxTime ms"
                    Write-Host ""
                    
                    # 設定效能基準（例如平均不超過 3 秒）
                    if ($avgTime -gt 3000) {
                        Write-Warning "⚠ 警告：平均響應時間超過 3 秒"
                        Write-Warning "建議檢查應用程式效能"
                    } else {
                        Write-Host "✓ 效能符合預期"
                    }
                } else {
                    Write-Error "✗ 所有效能測試請求都失敗了"
                    exit 1
                }

                Write-Host ""
                Write-Host "測試結果: 通過 ✓"
                Write-Host "========================================="

      - job: SecuritySmokeTests
        displayName: "安全性冒煙測試"
        dependsOn: FunctionalSmokeTests
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "8. HTTPS 強制轉向測試"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 8: HTTPS 強制轉向測試"
                Write-Host "========================================="

                $httpUrl = "http://$(appName).azurewebsites.net"
                Write-Host "測試 HTTP URL: $httpUrl"
                Write-Host "預期：應該重定向到 HTTPS"
                Write-Host ""

                try {
                    $response = Invoke-WebRequest -Uri $httpUrl -MaximumRedirection 0 -ErrorAction SilentlyContinue
                    
                    if ($response.StatusCode -eq 301 -or $response.StatusCode -eq 302 -or $response.StatusCode -eq 307 -or $response.StatusCode -eq 308) {
                        $location = $response.Headers['Location']
                        if ($location -like 'https://*') {
                            Write-Host "✓ 正確重定向到 HTTPS"
                            Write-Host "  重定向位置: $location"
                        } else {
                            Write-Warning "⚠ 重定向但不是到 HTTPS: $location"
                        }
                    } else {
                        Write-Warning "⚠ 沒有重定向（狀態碼: $($response.StatusCode)）"
                    }
                } catch {
                    # 某些情況下會直接使用 HTTPS
                    Write-Host "✓ HTTP 訪問被處理（可能直接使用 HTTPS）"
                }

                Write-Host ""
                Write-Host "測試結果: 通過 ✓"
                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "9. 安全標頭檢查"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "測試 9: 安全標頭檢查"
                Write-Host "========================================="

                $appUrl = "https://$(appName).azurewebsites.net"

                try {
                    $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing
                    
                    Write-Host "檢查重要的安全標頭..."
                    Write-Host ""
                    
                    # 檢查常見的安全標頭
                    $securityHeaders = @{
                        'X-Content-Type-Options' = 'nosniff'
                        'X-Frame-Options' = 'DENY or SAMEORIGIN'
                        'Strict-Transport-Security' = 'HSTS'
                    }
                    
                    foreach ($header in $securityHeaders.Keys) {
                        if ($response.Headers[$header]) {
                            Write-Host "✓ $header : $($response.Headers[$header])"
                        } else {
                            Write-Warning "⚠ 缺少 $header 標頭"
                        }
                    }
                    
                    Write-Host ""
                    Write-Host "測試結果: 通過 ✓"
                    
                } catch {
                    Write-Error "✗ 安全標頭檢查失敗: $_"
                    exit 1
                }

                Write-Host "========================================="

  - stage: SmokeTestReport
    displayName: "冒煙測試報告"
    dependsOn: SmokeTests
    condition: succeeded()
    jobs:
      - job: GenerateReport
        displayName: "生成測試報告"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "生成冒煙測試報告"
            inputs:
              targetType: "inline"
              script: |
                Write-Host ""
                Write-Host "========================================"
                Write-Host "       冒煙測試完成報告"
                Write-Host "========================================"
                Write-Host ""
                Write-Host "部署資訊："
                Write-Host "- 應用程式: $(appName)"
                Write-Host "- Build ID: $(Build.BuildId)"
                Write-Host "- 部署時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Write-Host "- 環境: Production"
                Write-Host ""
                Write-Host "測試結果摘要："
                Write-Host "✓ 1. 應用程式存活檢查 - 通過"
                Write-Host "✓ 2. 首頁載入測試 - 通過"
                Write-Host "✓ 3. 隱私頁面測試 - 通過"
                Write-Host "✓ 4. 靜態資源測試 - 通過"
                Write-Host "✓ 5. 資料庫連線測試 - 通過"
                Write-Host "✓ 6. 關鍵業務流程測試 - 通過"
                Write-Host "✓ 7. 效能基準測試 - 通過"
                Write-Host "✓ 8. HTTPS 強制轉向測試 - 通過"
                Write-Host "✓ 9. 安全標頭檢查 - 通過"
                Write-Host ""
                Write-Host "總測試數: 9"
                Write-Host "通過: 9"
                Write-Host "失敗: 0"
                Write-Host "成功率: 100%"
                Write-Host ""
                Write-Host "✓✓✓ 部署驗證成功 ✓✓✓"
                Write-Host "應用程式已準備好服務用戶"
                Write-Host ""
                Write-Host "========================================"

  # 回滾階段（當冒煙測試失敗時）
  - stage: RollbackOnFailure
    displayName: "測試失敗回滾"
    dependsOn: SmokeTests
    condition: failed()
    jobs:
      - deployment: Rollback
        displayName: "執行自動回滾"
        environment: "production-rollback"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: "回滾警告"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "========================================"
                      Write-Host "⚠⚠⚠ 冒煙測試失敗 - 執行回滾 ⚠⚠⚠"
                      Write-Host "========================================"
                      Write-Host ""
                      Write-Host "失敗的部署將被回滾到前一個穩定版本"
                      Write-Host "Build ID: $(Build.BuildId)"
                      Write-Host "失敗時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                      Write-Host ""

                - task: AzureAppServiceManage@0
                  displayName: "回滾到前一個版本"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    Action: "Swap Slots"
                    WebAppName: "$(appName)"
                    ResourceGroupName: "$(resourceGroupName)"
                    SourceSlot: "staging"
                    SwapWithProduction: true

                - task: PowerShell@2
                  displayName: "驗證回滾結果"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "驗證回滾後的應用程式狀態..."
                      Start-Sleep -Seconds 20

                      $appUrl = "https://$(appName).azurewebsites.net/health"

                      try {
                          $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing
                          if ($response.StatusCode -eq 200) {
                              Write-Host "✓ 回滾成功，應用程式恢復正常"
                          } else {
                              Write-Error "✗ 回滾後應用程式狀態異常"
                          }
                      } catch {
                          Write-Error "✗ 回滾後無法訪問應用程式"
                      }

                - task: PowerShell@2
                  displayName: "回滾報告與後續步驟"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host ""
                      Write-Host "========================================"
                      Write-Host "回滾完成報告"
                      Write-Host "========================================"
                      Write-Host "失敗的 Build ID: $(Build.BuildId)"
                      Write-Host "回滾時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                      Write-Host "當前狀態: 已恢復到穩定版本"
                      Write-Host ""
                      Write-Host "後續步驟："
                      Write-Host "1. 查看失敗的冒煙測試日誌"
                      Write-Host "2. 在本地或測試環境重現問題"
                      Write-Host "3. 修復問題"
                      Write-Host "4. 重新提交並部署"
                      Write-Host ""
                      Write-Host "========================================"

# ========================================
# 冒煙測試最佳實踐
# ========================================
#
# 1. 保持測試快速（5-10分鐘內完成）
# 2. 只測試關鍵路徑，不是完整測試
# 3. 測試應該是穩定的，減少誤報
# 4. 失敗時提供清晰的錯誤訊息
# 5. 自動化回滾機制
# 6. 測試真實的生產環境，不是模擬
# 7. 包含效能基準測試
# 8. 測試第三方服務整合
# 9. 記錄測試結果供後續分析
# 10. 定期檢視和更新測試案例
#
# ========================================
