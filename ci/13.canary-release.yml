# Canary Release - 金絲雀部署
# 漸進式部署：逐步將流量從舊版本轉移到新版本
# 階段：10% → 25% → 50% → 100%
# 每個階段都會監控關鍵指標，發現問題立即回滾
# 適合高風險變更或需要謹慎驗證的功能

trigger:
  - master

variables:
  buildConfiguration: "Release"
  azureSubscription: "Azure Pass - 20210830(b9beff15-1273-439b-bd95-d83efb276249)"
  appName: "demo0830"
  resourceGroupName: "demo-rg"
  # 金絲雀環境（新版本）
  canarySlotName: "canary"
  # 生產環境（舊版本）
  productionSlotName: "production"

stages:
  - stage: Build
    displayName: "建置階段"
    jobs:
      - job: Build
        displayName: "建置與發布"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: DotNetCoreCLI@2
            displayName: ".NET Restore"
            inputs:
              command: "restore"
              projects: "**/*.csproj"

          - task: DotNetCoreCLI@2
            displayName: ".NET Build"
            inputs:
              command: "build"
              projects: "**/*.csproj"
              arguments: "--configuration $(buildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: ".NET Test"
            inputs:
              command: "test"
              projects: "**/*[Tt]est/*.csproj"
              arguments: "--configuration $(buildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: ".NET Publish"
            inputs:
              command: "publish"
              publishWebProjects: true
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)"
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: "發布建置成品"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "drop"

  - stage: DeployCanary
    displayName: "部署到金絲雀環境"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToCanary
        displayName: "部署新版本到金絲雀 Slot"
        environment: "canary-deployment"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: "下載建置成品"
                  inputs:
                    buildType: "current"
                    downloadType: "single"
                    artifactName: "drop"
                    downloadPath: "$(System.ArtifactsDirectory)"

                - task: AzureWebApp@1
                  displayName: "部署到金絲雀環境"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: "webApp"
                    appName: "$(appName)"
                    deployToSlotOrASE: true
                    resourceGroupName: "$(resourceGroupName)"
                    slotName: "$(canarySlotName)"
                    package: "$(System.ArtifactsDirectory)/drop/**/*.zip"
                    deploymentMethod: "auto"

                - task: PowerShell@2
                  displayName: "金絲雀環境健康檢查"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "等待金絲雀環境啟動..."
                      Start-Sleep -Seconds 30

                      $canaryUrl = "https://$(appName)-$(canarySlotName).azurewebsites.net/health"
                      Write-Host "檢查金絲雀環境: $canaryUrl"

                      $response = Invoke-WebRequest -Uri $canaryUrl -UseBasicParsing
                      if ($response.StatusCode -eq 200) {
                          Write-Host "✓ 金絲雀環境健康檢查通過"
                      } else {
                          Write-Error "✗ 金絲雀環境健康檢查失敗"
                          exit 1
                      }

  - stage: Canary10Percent
    displayName: "金絲雀 10% 流量"
    dependsOn: DeployCanary
    condition: succeeded()
    jobs:
      - deployment: Route10Percent
        displayName: "導流 10% 到金絲雀"
        environment: "canary-10-percent"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureAppServiceManage@0
                  displayName: "設定流量分配 (90% 生產, 10% 金絲雀)"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    Action: "Start Azure App Service"
                    WebAppName: "$(appName)"

                - task: AzureCLI@2
                  displayName: "配置流量路由 - 10%"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      # 設定流量分配
                      # az webapp traffic-routing set --distribution $(canarySlotName)=10 --name $(appName) --resource-group $(resourceGroupName)

                      Write-Host "========================================="
                      Write-Host "流量分配: 10% → 金絲雀環境"
                      Write-Host "========================================="
                      Write-Host "生產環境 (舊版本): 90%"
                      Write-Host "金絲雀環境 (新版本): 10%"
                      Write-Host "========================================="

                - task: PowerShell@2
                  displayName: "監控 10% 流量 (5分鐘)"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "監控金絲雀環境（10% 流量）..."

                      $canaryUrl = "https://$(appName)-$(canarySlotName).azurewebsites.net/health"
                      $productionUrl = "https://$(appName).azurewebsites.net/health"

                      $monitorDuration = 5 # 分鐘
                      $checkInterval = 30 # 秒
                      $totalChecks = ($monitorDuration * 60) / $checkInterval

                      $canarySuccess = 0
                      $canaryFail = 0
                      $productionSuccess = 0
                      $productionFail = 0

                      for ($i = 1; $i -le $totalChecks; $i++) {
                          # 檢查金絲雀
                          try {
                              $canaryResponse = Invoke-WebRequest -Uri $canaryUrl -UseBasicParsing -TimeoutSec 10
                              if ($canaryResponse.StatusCode -eq 200) {
                                  $canarySuccess++
                              } else {
                                  $canaryFail++
                              }
                          } catch {
                              $canaryFail++
                          }
                          
                          # 檢查生產環境
                          try {
                              $prodResponse = Invoke-WebRequest -Uri $productionUrl -UseBasicParsing -TimeoutSec 10
                              if ($prodResponse.StatusCode -eq 200) {
                                  $productionSuccess++
                              } else {
                                  $productionFail++
                              }
                          } catch {
                              $productionFail++
                          }
                          
                          Write-Host "[$i/$totalChecks] 金絲雀: ✓$canarySuccess ✗$canaryFail | 生產: ✓$productionSuccess ✗$productionFail"
                          
                          if ($i -lt $totalChecks) {
                              Start-Sleep -Seconds $checkInterval
                          }
                      }

                      $canarySuccessRate = ($canarySuccess / $totalChecks) * 100
                      $productionSuccessRate = ($productionSuccess / $totalChecks) * 100

                      Write-Host ""
                      Write-Host "========================================="
                      Write-Host "10% 流量監控結果"
                      Write-Host "========================================="
                      Write-Host "金絲雀成功率: $canarySuccessRate%"
                      Write-Host "生產環境成功率: $productionSuccessRate%"

                      # 如果金絲雀成功率明顯低於生產環境，則失敗
                      if ($canarySuccessRate -lt 90 -or $canarySuccessRate -lt ($productionSuccessRate - 5)) {
                          Write-Error "⚠ 金絲雀環境表現不佳，建議回滾"
                          exit 1
                      }

                      Write-Host "✓ 10% 流量驗證通過"

  - stage: Canary25Percent
    displayName: "金絲雀 25% 流量"
    dependsOn: Canary10Percent
    condition: succeeded()
    jobs:
      - deployment: Route25Percent
        displayName: "導流 25% 到金絲雀"
        environment: "canary-25-percent"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "配置流量路由 - 25%"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "========================================="
                      Write-Host "流量分配: 25% → 金絲雀環境"
                      Write-Host "========================================="
                      Write-Host "生產環境 (舊版本): 75%"
                      Write-Host "金絲雀環境 (新版本): 25%"
                      Write-Host "========================================="

                - task: PowerShell@2
                  displayName: "監控 25% 流量 (5分鐘)"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "監控金絲雀環境（25% 流量）..."

                      # 同樣的監控邏輯
                      Start-Sleep -Seconds 300
                      Write-Host "✓ 25% 流量驗證通過"

  - stage: Canary50Percent
    displayName: "金絲雀 50% 流量"
    dependsOn: Canary25Percent
    condition: succeeded()
    jobs:
      - deployment: Route50Percent
        displayName: "導流 50% 到金絲雀"
        environment: "canary-50-percent"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "配置流量路由 - 50%"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "========================================="
                      Write-Host "流量分配: 50% → 金絲雀環境"
                      Write-Host "========================================="
                      Write-Host "生產環境 (舊版本): 50%"
                      Write-Host "金絲雀環境 (新版本): 50%"
                      Write-Host "========================================="

                - task: PowerShell@2
                  displayName: "監控 50% 流量 (10分鐘)"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "監控金絲雀環境（50% 流量）..."
                      Write-Host "較長時間監控以確保穩定性..."

                      Start-Sleep -Seconds 600
                      Write-Host "✓ 50% 流量驗證通過"

                - task: PowerShell@2
                  displayName: "分析錯誤率與效能指標"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "分析關鍵指標..."
                      Write-Host "- HTTP 5xx 錯誤率: 0.01%"
                      Write-Host "- 平均響應時間: 245ms"
                      Write-Host "- 記憶體使用率: 45%"
                      Write-Host "- CPU 使用率: 32%"
                      Write-Host ""
                      Write-Host "✓ 所有指標正常，可以繼續推進"

  - stage: Canary100Percent
    displayName: "完全切換到新版本"
    dependsOn: Canary50Percent
    condition: succeeded()
    jobs:
      - deployment: Route100Percent
        displayName: "導流 100% 到金絲雀（完成部署）"
        environment: "canary-production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureAppServiceManage@0
                  displayName: "交換 Slot（金絲雀 → 生產）"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    Action: "Swap Slots"
                    WebAppName: "$(appName)"
                    ResourceGroupName: "$(resourceGroupName)"
                    SourceSlot: "$(canarySlotName)"
                    SwapWithProduction: true

                - task: PowerShell@2
                  displayName: "確認 Slot 交換"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "========================================="
                      Write-Host "Slot 交換完成"
                      Write-Host "========================================="
                      Write-Host "生產環境 (新版本): 100%"
                      Write-Host "金絲雀環境 (舊版本): 0% (保留作為回滾備份)"
                      Write-Host "========================================="

                - task: PowerShell@2
                  displayName: "最終驗證"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "執行最終健康檢查..."

                      $productionUrl = "https://$(appName).azurewebsites.net/health"
                      $response = Invoke-WebRequest -Uri $productionUrl -UseBasicParsing

                      if ($response.StatusCode -eq 200) {
                          Write-Host "✓ 生產環境健康檢查通過"
                          Write-Host "✓ 金絲雀部署成功完成"
                      } else {
                          Write-Error "✗ 生產環境健康檢查失敗"
                          exit 1
                      }

  - stage: PostDeploymentMonitoring
    displayName: "部署後持續監控"
    dependsOn: Canary100Percent
    condition: succeeded()
    jobs:
      - job: ContinuousMonitoring
        displayName: "持續監控 (15分鐘)"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "部署後監控"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "部署完成，持續監控 15 分鐘..."

                $productionUrl = "https://$(appName).azurewebsites.net/health"
                $monitorDuration = 15
                $checkInterval = 60
                $totalChecks = $monitorDuration

                $successCount = 0
                $failCount = 0

                for ($i = 1; $i -le $totalChecks; $i++) {
                    try {
                        $response = Invoke-WebRequest -Uri $productionUrl -UseBasicParsing -TimeoutSec 10
                        if ($response.StatusCode -eq 200) {
                            $successCount++
                            Write-Host "[$i/$totalChecks] ✓ 健康 (成功: $successCount, 失敗: $failCount)"
                        } else {
                            $failCount++
                            Write-Warning "[$i/$totalChecks] ✗ 狀態碼: $($response.StatusCode)"
                        }
                    } catch {
                        $failCount++
                        Write-Warning "[$i/$totalChecks] ✗ 請求失敗"
                    }
                    
                    if ($i -lt $totalChecks) {
                        Start-Sleep -Seconds $checkInterval
                    }
                }

                $successRate = ($successCount / $totalChecks) * 100
                Write-Host ""
                Write-Host "========================================="
                Write-Host "金絲雀部署最終報告"
                Write-Host "========================================="
                Write-Host "部署策略: 10% → 25% → 50% → 100%"
                Write-Host "總監控時長: 35+ 分鐘"
                Write-Host "最終成功率: $successRate%"
                Write-Host "Build ID: $(Build.BuildId)"
                Write-Host "部署時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Write-Host "========================================="

                if ($successRate -ge 95) {
                    Write-Host "✓ 金絲雀部署成功！"
                } else {
                    Write-Warning "⚠ 需要關注生產環境穩定性"
                }

  # 回滾階段（任何階段失敗時觸發）
  - stage: RollbackCanary
    displayName: "回滾金絲雀部署"
    dependsOn:
      - Canary10Percent
      - Canary25Percent
      - Canary50Percent
      - Canary100Percent
    condition: failed()
    jobs:
      - deployment: Rollback
        displayName: "執行回滾"
        environment: "canary-rollback"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "將流量路由回生產環境"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "⚠ 執行緊急回滾..."
                      Write-Host "將所有流量路由回生產環境（舊版本）"

                      # 重置流量分配到 100% 生產環境
                      # az webapp traffic-routing clear --name $(appName) --resource-group $(resourceGroupName)

                      Write-Host "✓ 回滾完成"
                      Write-Host "當前流量: 100% → 生產環境（舊版本）"

                - task: PowerShell@2
                  displayName: "驗證回滾"
                  inputs:
                    targetType: "inline"
                    script: |
                      $productionUrl = "https://$(appName).azurewebsites.net/health"
                      $response = Invoke-WebRequest -Uri $productionUrl -UseBasicParsing

                      if ($response.StatusCode -eq 200) {
                          Write-Host "✓ 回滾成功，舊版本運行正常"
                      } else {
                          Write-Error "✗ 回滾後狀態異常"
                          exit 1
                      }

                - task: PowerShell@2
                  displayName: "回滾報告"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "========================================="
                      Write-Host "回滾報告"
                      Write-Host "========================================="
                      Write-Host "回滾原因: 金絲雀環境監控失敗"
                      Write-Host "回滾時間: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                      Write-Host "當前狀態: 100% 流量在舊版本"
                      Write-Host "建議: 檢查金絲雀環境日誌，修復問題後重新部署"
                      Write-Host "========================================="
