  - stage: DeployIfSecure
    displayName: "安全驗證後部署"
    dependsOn: SecurityReport
    condition: succeeded()
    jobs:
      - deployment: SecureDeploy
        displayName: "執行安全部署"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: "部署前最終安全確認"
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "========================================="
                      Write-Host "部署前最終安全確認"
                      Write-Host "========================================="
                      Write-Host ""
                      Write-Host "✓ 所有安全掃描已通過"
                      Write-Host "✓ 無嚴重漏洞"
                      Write-Host "✓ 符合部署安全標準"
                      Write-Host ""
                      Write-Host "繼續執行部署..."
                      Write-Host "========================================="

                - task: DownloadBuildArtifacts@0
                  displayName: "下載建置成品"
                  inputs:
                    buildType: "current"
                    downloadType: "single"
                    artifactName: "drop"
                    downloadPath: "$(System.ArtifactsDirectory)"

                - task: AzureWebApp@1
                  displayName: "部署到 Azure Web App"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: "webApp"
                    appName: "$(appName)"
                    package: "$(System.ArtifactsDirectory)/drop/**/*.zip"
                    deploymentMethod: "auto"
# ========================================
# 安全掃描最佳實踐
# ========================================
#
# 1. 分層防禦（Defense in Depth）
#    - 在多個層次進行安全掃描
#    - 不依賴單一工具或方法
#
# 2. 左移測試（Shift Left）
#    - 在開發階段就進行安全掃描
#    - IDE 整合、Pre-commit hooks
#
# 3. 持續掃描
#    - 定期掃描即使沒有程式碼變更
#    - 新漏洞不斷被發現（Zero-day）
#
# 4. 優先級管理
#    - Critical/High 優先修復
#    - Medium/Low 計劃修復
#    - 設定合理的閾值
#
# 5. 誤報處理
#    - 建立抑制清單（Suppression List）
#    - 記錄為何是誤報
#    - 定期審查抑制清單
#
# 6. 開發者教育
#    - 提供修復建議和文件
#    - 安全編碼培訓
#    - 分享最佳實踐
#
# 7. 自動化修復
#    - Dependabot/Renovate 自動更新依賴
#    - 自動產生修復 PR
#
# 8. 合規性追蹤
#    - 生成合規報告
#    - 追蹤安全指標趨勢
#    - 定期安全審計
#
# ========================================
