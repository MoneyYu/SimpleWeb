# Security Scanning Integration - 安全掃描整合到 CD
#
# ========================================
# 使用情境說明
# ========================================
#
# 這個 Pipeline 展示如何在 CD 流程中整合多層次的安全掃描，
# 實現「左移安全」（Shift Left Security）策略，在部署前發現並阻止安全漏洞。
#
# 什麼是安全掃描整合？
# - 在 CI/CD 流程中自動執行各種安全檢查
# - 掃描程式碼、依賴套件、容器映像、基礎設施配置等
# - 在安全問題進入生產環境前就發現並修復
# - 符合資安合規性要求（SOC 2, PCI DSS, HIPAA 等）
#
# 適用場景：
# 1. 企業合規要求：需要證明軟體開發過程符合安全標準
# 2. 開源套件管理：自動檢測第三方套件的已知漏洞
# 3. 容器安全：掃描 Docker 映像中的漏洞
# 4. 秘密洩漏防護：防止 API Key、密碼等敏感資訊被提交到程式碼庫
# 5. 程式碼安全審查：自動化 SAST（靜態應用安全測試）
# 6. 供應鏈安全：確保依賴套件的完整性和安全性
# 7. 基礎設施即代碼（IaC）安全：掃描 Terraform、ARM 模板等
#
# 安全掃描的層次：
# 1. 程式碼層（SAST）
#    - 靜態程式碼分析，找出潛在的安全漏洞
#    - SQL Injection, XSS, CSRF 等常見漏洞
#
# 2. 依賴套件層（SCA - Software Composition Analysis）
#    - 掃描 NuGet、npm、pip 等套件的已知漏洞（CVE）
#    - 檢查套件授權合規性
#
# 3. 容器映像層
#    - 掃描 Docker 映像中的 OS 漏洞
#    - 檢查映像配置的安全最佳實踐
#
# 4. 秘密掃描層
#    - 檢測程式碼中是否包含 API Key、密碼、Token
#    - 防止敏感資訊洩漏
#
# 5. 基礎設施層（IaC）
#    - 掃描 Terraform、Bicep、CloudFormation 模板
#    - 檢查安全配置錯誤
#
# 常用安全掃描工具：
# - OWASP Dependency-Check：開源依賴套件掃描
# - Trivy：容器映像和依賴掃描
# - WhiteSource/Mend：商業級 SCA 工具
# - Snyk：開發者友善的安全掃描平台
# - SonarQube：程式碼品質和安全掃描
# - GitGuardian/TruffleHog：秘密掃描
# - Checkov：基礎設施即代碼掃描
#
# 優勢：
# - 早期發現問題：在開發階段就發現安全漏洞，修復成本低
# - 自動化合規：自動生成安全合規報告
# - 降低風險：阻止已知漏洞進入生產環境
# - 開發者教育：通過掃描結果教育開發者安全最佳實踐
# - 持續改進：追蹤安全指標隨時間的變化
#
# 實際案例：
# - GitHub：在 CI 中整合 CodeQL 進行安全掃描
# - Netflix：使用多層次安全掃描保護雲端基礎設施
# - Microsoft：Azure DevOps 整合 Defender for DevOps
# - Google：使用 OSS-Fuzz 持續模糊測試開源專案
#
# 安全掃描策略：
# - 開發階段：快速掃描，提供即時反饋
# - PR 階段：完整掃描，阻止有漏洞的程式碼合併
# - 部署階段：最終驗證，確保沒有高風險漏洞
# - 定期掃描：即使沒有變更，也定期掃描（新漏洞不斷被發現）
#
# ========================================

trigger:
  - master

variables:
  buildConfiguration: "Release"
  azureSubscription: "Azure Pass - 20210830(b9beff15-1273-439b-bd95-d83efb276249)"
  appName: "demo0830"
  resourceGroupName: "demo-rg"
  # 安全掃描閾值設定
  criticalVulnerabilityThreshold: 0 # 不允許任何嚴重漏洞
  highVulnerabilityThreshold: 5 # 最多允許 5 個高風險漏洞
  # Docker 設定
  dockerRegistryServiceConnection: "demo-acr-connection"
  imageRepository: "simpleweb"
  containerRegistry: "demo0903.azurecr.io"
  dockerfilePath: "**/Dockerfile"
  tag: "$(Build.BuildId)"

stages:
  - stage: Build
    displayName: "建置階段"
    jobs:
      - job: Build
        displayName: "建置應用程式"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: DotNetCoreCLI@2
            displayName: ".NET Restore"
            inputs:
              command: "restore"
              projects: "**/*.csproj"

          - task: DotNetCoreCLI@2
            displayName: ".NET Build"
            inputs:
              command: "build"
              projects: "**/*.csproj"
              arguments: "--configuration $(buildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: ".NET Publish"
            inputs:
              command: "publish"
              publishWebProjects: true
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)"
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: "發布建置成品"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "drop"

  - stage: SecurityScanning
    displayName: "安全掃描階段"
    dependsOn: Build
    jobs:
      - job: DependencyScanning
        displayName: "依賴套件漏洞掃描"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "掃描說明"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "依賴套件漏洞掃描 (SCA)"
                Write-Host "========================================="
                Write-Host ""
                Write-Host "掃描目標："
                Write-Host "- NuGet 套件"
                Write-Host "- npm 套件（如果有前端專案）"
                Write-Host ""
                Write-Host "掃描內容："
                Write-Host "- 已知 CVE（Common Vulnerabilities and Exposures）"
                Write-Host "- 套件授權合規性"
                Write-Host "- 過時的套件版本"
                Write-Host ""
                Write-Host "使用工具："
                Write-Host "- OWASP Dependency-Check"
                Write-Host "- dotnet list package --vulnerable"
                Write-Host "- Trivy (多用途掃描器)"
                Write-Host "========================================="

          - task: DotNetCoreCLI@2
            displayName: "dotnet list package --vulnerable"
            inputs:
              command: "custom"
              custom: "list"
              arguments: "package --vulnerable --include-transitive"
              workingDirectory: "$(Build.SourcesDirectory)/src"
            continueOnError: true

          - task: PowerShell@2
            displayName: "使用 OWASP Dependency-Check 掃描"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "執行 OWASP Dependency-Check"
                Write-Host "========================================="
                Write-Host ""

                # 下載並安裝 OWASP Dependency-Check
                # Write-Host "下載 Dependency-Check..."
                # $dcVersion = "8.4.0"
                # Invoke-WebRequest -Uri "https://github.com/jeremylong/DependencyCheck/releases/download/v$dcVersion/dependency-check-$dcVersion-release.zip" -OutFile "dc.zip"
                # Expand-Archive -Path "dc.zip" -DestinationPath "."

                # 執行掃描
                # ./dependency-check/bin/dependency-check.sh --scan $(Build.SourcesDirectory) --format HTML --format JSON --out $(Build.ArtifactStagingDirectory)/dependency-check

                Write-Host "掃描 .NET 專案的依賴套件..."
                Write-Host ""
                Write-Host "掃描結果（模擬）："
                Write-Host "- 總套件數: 45"
                Write-Host "- 嚴重漏洞 (Critical): 0"
                Write-Host "- 高風險漏洞 (High): 2"
                Write-Host "- 中風險漏洞 (Medium): 5"
                Write-Host "- 低風險漏洞 (Low): 3"
                Write-Host ""
                Write-Host "發現的漏洞："
                Write-Host "1. [HIGH] Newtonsoft.Json 12.0.3 - CVE-2024-XXXXX"
                Write-Host "   建議升級到: 13.0.3+"
                Write-Host ""
                Write-Host "2. [HIGH] System.Text.Json 5.0.0 - CVE-2024-YYYYY"
                Write-Host "   建議升級到: 6.0.0+"
                Write-Host ""

                # 檢查是否超過閾值
                $criticalCount = 0
                $highCount = 2

                if ($criticalCount -gt $(criticalVulnerabilityThreshold)) {
                    Write-Error "✗ 發現 $criticalCount 個嚴重漏洞，超過允許的 $(criticalVulnerabilityThreshold) 個"
                    Write-Host "##vso[task.setvariable variable=SecurityScanFailed]true"
                    exit 1
                }

                if ($highCount -gt $(highVulnerabilityThreshold)) {
                    Write-Warning "⚠ 發現 $highCount 個高風險漏洞，接近閾值 $(highVulnerabilityThreshold)"
                } else {
                    Write-Host "✓ 高風險漏洞數量在可接受範圍內"
                }

                Write-Host ""
                Write-Host "建議措施："
                Write-Host "1. 檢查是否有可用的安全更新"
                Write-Host "2. 評估漏洞的實際影響"
                Write-Host "3. 如果無法立即更新，考慮緩解措施"
                Write-Host "========================================="

      - job: SecretScanning
        displayName: "秘密掃描"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "掃描敏感資訊洩漏"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "秘密掃描 (Secret Scanning)"
                Write-Host "========================================="
                Write-Host ""
                Write-Host "掃描目標："
                Write-Host "- API Keys"
                Write-Host "- 密碼"
                Write-Host "- Token (GitHub, Azure, AWS)"
                Write-Host "- 連接字串"
                Write-Host "- 私鑰"
                Write-Host "- 憑證"
                Write-Host ""

                # 使用簡單的正則表達式掃描
                Write-Host "掃描程式碼中的常見秘密模式..."
                Write-Host ""

                $secretPatterns = @{
                    'Azure Storage Connection String' = 'DefaultEndpointsProtocol=https;AccountName=.*AccountKey='
                    'Azure SQL Connection String' = 'Server=tcp:.*database.windows.net'
                    'API Key' = 'api[_-]?key["\s]*[:=]["\s]*[a-zA-Z0-9]{20,}'
                    'AWS Access Key' = 'AKIA[0-9A-Z]{16}'
                    'GitHub Token' = 'ghp_[a-zA-Z0-9]{36}'
                    'Private Key' = '-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----'
                }

                $foundSecrets = @()

                # 實際環境中會使用 git-secrets, truffleHog, 或 GitGuardian
                # git secrets --scan
                # truffleHog --regex --entropy=False .

                Write-Host "掃描結果："
                Write-Host ""

                # 模擬發現問題
                if ($false) {
                    Write-Host "⚠ 發現潛在的敏感資訊！"
                    Write-Host ""
                    Write-Host "位置: src/SimpleWeb/appsettings.json"
                    Write-Host "類型: Connection String"
                    Write-Host "行號: 12"
                    Write-Host ""
                    Write-Error "✗ 請移除敏感資訊，使用 Azure Key Vault 或環境變數"
                    exit 1
                } else {
                    Write-Host "✓ 未發現明顯的敏感資訊洩漏"
                    Write-Host ""
                    Write-Host "最佳實踐提醒："
                    Write-Host "1. 使用 Azure Key Vault 存放秘密"
                    Write-Host "2. 使用環境變數而非硬編碼"
                    Write-Host "3. 不要在 appsettings.json 中存放生產環境的連接字串"
                    Write-Host "4. 設定 .gitignore 排除敏感檔案"
                    Write-Host "5. 啟用 GitHub Secret Scanning"
                }

                Write-Host ""
                Write-Host "========================================="

      - job: StaticCodeAnalysis
        displayName: "SAST - 靜態應用安全測試"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "SAST 掃描"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "SAST - 靜態應用安全測試"
                Write-Host "========================================="
                Write-Host ""
                Write-Host "掃描技術："
                Write-Host "- 靜態程式碼分析"
                Write-Host "- 資料流分析"
                Write-Host "- 污點分析（Taint Analysis）"
                Write-Host ""
                Write-Host "檢測的安全漏洞類型："
                Write-Host "- SQL Injection"
                Write-Host "- Cross-Site Scripting (XSS)"
                Write-Host "- Cross-Site Request Forgery (CSRF)"
                Write-Host "- Path Traversal"
                Write-Host "- Insecure Deserialization"
                Write-Host "- Weak Cryptography"
                Write-Host "- Hardcoded Credentials"
                Write-Host ""

                # 實際環境中可以使用：
                # - SonarQube Scanner
                # - Microsoft Security Code Analysis
                # - Checkmarx
                # - Fortify
                # - Veracode

                Write-Host "執行安全程式碼分析..."
                Write-Host ""

                # 模擬 SAST 掃描結果
                Write-Host "掃描結果："
                Write-Host "- 掃描檔案數: 45"
                Write-Host "- 程式碼行數: 2,345"
                Write-Host ""
                Write-Host "發現的安全問題："
                Write-Host "- 嚴重 (Critical): 0"
                Write-Host "- 高 (High): 1"
                Write-Host "- 中 (Medium): 3"
                Write-Host "- 低 (Low): 5"
                Write-Host ""
                Write-Host "問題詳情："
                Write-Host ""
                Write-Host "1. [HIGH] 潛在的 SQL Injection 風險"
                Write-Host "   位置: Controllers/HomeController.cs:45"
                Write-Host "   建議: 使用參數化查詢或 Entity Framework"
                Write-Host ""
                Write-Host "2. [MEDIUM] 未驗證的重定向"
                Write-Host "   位置: Controllers/HomeController.cs:78"
                Write-Host "   建議: 驗證重定向 URL 是否為白名單"
                Write-Host ""
                Write-Host "3. [MEDIUM] 弱加密演算法"
                Write-Host "   位置: Services/EncryptionService.cs:23"
                Write-Host "   建議: 使用 AES-256 或更強的加密"
                Write-Host ""

                # 檢查是否有嚴重問題
                $criticalIssues = 0
                $highIssues = 1

                if ($criticalIssues -gt 0) {
                    Write-Error "✗ 發現嚴重的安全漏洞，必須修復後才能部署"
                    exit 1
                } elseif ($highIssues -gt 0) {
                    Write-Warning "⚠ 發現高風險安全問題，建議修復"
                    Write-Host "可以繼續部署，但請盡快修復"
                } else {
                    Write-Host "✓ 未發現高風險安全問題"
                }

                Write-Host ""
                Write-Host "========================================="

      - job: ContainerImageScanning
        displayName: "容器映像安全掃描"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Docker@2
            displayName: "建置 Docker 映像"
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          - task: PowerShell@2
            displayName: "使用 Trivy 掃描容器映像"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "容器映像安全掃描 - Trivy"
                Write-Host "========================================="
                Write-Host ""
                Write-Host "Trivy 是什麼？"
                Write-Host "- 開源的容器映像掃描工具"
                Write-Host "- 可以掃描 OS 套件和應用程式依賴"
                Write-Host "- 支援 Docker、OCI 映像"
                Write-Host "- 快速且易於使用"
                Write-Host ""

                # 安裝 Trivy
                Write-Host "安裝 Trivy..."
                # sudo apt-get install wget apt-transport-https gnupg lsb-release
                # wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
                # echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
                # sudo apt-get update
                # sudo apt-get install trivy

                Write-Host "✓ Trivy 安裝完成"
                Write-Host ""

                # 掃描映像
                Write-Host "掃描 Docker 映像: $(imageRepository):$(tag)"
                # trivy image --severity CRITICAL,HIGH --exit-code 1 $(imageRepository):$(tag)

                Write-Host ""
                Write-Host "掃描結果（模擬）："
                Write-Host ""
                Write-Host "映像資訊："
                Write-Host "- 基礎映像: mcr.microsoft.com/dotnet/aspnet:8.0"
                Write-Host "- 映像大小: 215 MB"
                Write-Host "- 層數: 12"
                Write-Host ""
                Write-Host "漏洞統計："
                Write-Host "- CRITICAL: 0"
                Write-Host "- HIGH: 3"
                Write-Host "- MEDIUM: 15"
                Write-Host "- LOW: 42"
                Write-Host ""
                Write-Host "發現的漏洞："
                Write-Host ""
                Write-Host "1. [HIGH] CVE-2024-12345"
                Write-Host "   套件: openssl 1.1.1f"
                Write-Host "   修復版本: 1.1.1w"
                Write-Host "   描述: Buffer overflow vulnerability"
                Write-Host ""
                Write-Host "2. [HIGH] CVE-2024-54321"
                Write-Host "   套件: curl 7.68.0"
                Write-Host "   修復版本: 7.88.1"
                Write-Host "   描述: Certificate validation bypass"
                Write-Host ""
                Write-Host "3. [HIGH] CVE-2024-99999"
                Write-Host "   套件: libssl1.1"
                Write-Host "   修復版本: 升級基礎映像"
                Write-Host "   描述: Denial of Service"
                Write-Host ""

                Write-Host "建議措施："
                Write-Host "1. 升級基礎映像到最新版本"
                Write-Host "2. 使用 Google Distroless 或 Alpine 基礎映像"
                Write-Host "3. 定期重新建置映像以獲取安全更新"
                Write-Host "4. 實施映像簽名驗證"
                Write-Host ""

                # 檢查漏洞數量
                $criticalVulns = 0
                $highVulns = 3

                if ($criticalVulns -gt 0) {
                    Write-Error "✗ 發現嚴重的容器漏洞，禁止部署"
                    exit 1
                } elseif ($highVulns -gt 10) {
                    Write-Warning "⚠ 高風險漏洞較多，建議修復"
                } else {
                    Write-Host "✓ 容器映像可以部署（有少量高風險漏洞需後續修復）"
                }

                Write-Host ""
                Write-Host "========================================="

          - task: PowerShell@2
            displayName: "Docker 映像最佳實踐檢查"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "Docker 映像安全最佳實踐檢查"
                Write-Host "========================================="
                Write-Host ""

                # 檢查 Dockerfile 的安全最佳實踐
                $dockerfilePath = "$(Build.SourcesDirectory)/src/SimpleWeb/Dockerfile"

                if (Test-Path $dockerfilePath) {
                    $dockerfileContent = Get-Content $dockerfilePath -Raw
                    
                    Write-Host "檢查項目："
                    Write-Host ""
                    
                    # 1. 檢查是否使用非 root 用戶
                    if ($dockerfileContent -match "USER\s+(?!root)") {
                        Write-Host "✓ 使用非 root 用戶運行容器"
                    } else {
                        Write-Warning "⚠ 建議使用非 root 用戶運行容器"
                    }
                    
                    # 2. 檢查基礎映像標籤
                    if ($dockerfileContent -match "FROM.*:latest") {
                        Write-Warning "⚠ 避免使用 :latest 標籤，建議指定明確版本"
                    } else {
                        Write-Host "✓ 使用明確的映像版本標籤"
                    }
                    
                    # 3. 檢查 HEALTHCHECK
                    if ($dockerfileContent -match "HEALTHCHECK") {
                        Write-Host "✓ 定義了 HEALTHCHECK"
                    } else {
                        Write-Warning "⚠ 建議添加 HEALTHCHECK 指令"
                    }
                    
                    # 4. 檢查多階段建置
                    if ($dockerfileContent -match "FROM.*AS") {
                        Write-Host "✓ 使用多階段建置減少映像大小"
                    } else {
                        Write-Host "ℹ 考慮使用多階段建置優化映像"
                    }
                    
                    Write-Host ""
                    Write-Host "更多最佳實踐："
                    Write-Host "1. 最小化層數（合併 RUN 指令）"
                    Write-Host "2. 使用 .dockerignore 排除不必要的檔案"
                    Write-Host "3. 掃描並移除不必要的套件"
                    Write-Host "4. 設定資源限制（CPU、記憶體）"
                    Write-Host "5. 使用內容信任（Docker Content Trust）"
                    
                } else {
                    Write-Host "找不到 Dockerfile"
                }

                Write-Host ""
                Write-Host "========================================="

      - job: InfrastructureAsCodeScanning
        displayName: "基礎設施即代碼掃描 (IaC)"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "掃描 Bicep/ARM 模板"
            inputs:
              targetType: "inline"
              script: |
                Write-Host "========================================="
                Write-Host "基礎設施即代碼安全掃描"
                Write-Host "========================================="
                Write-Host ""
                Write-Host "掃描目標："
                Write-Host "- Bicep 模板"
                Write-Host "- ARM 模板"
                Write-Host "- Terraform 配置（如果有）"
                Write-Host ""

                # 使用 Checkov 或 Azure Policy 掃描
                # checkov -d bicep/ --framework bicep

                Write-Host "檢查安全配置..."
                Write-Host ""

                # 檢查 Bicep 檔案
                $bicepPath = "$(Build.SourcesDirectory)/bicep/main.bicep"

                if (Test-Path $bicepPath) {
                    Write-Host "發現 Bicep 模板: $bicepPath"
                    Write-Host ""
                    
                    # 模擬安全檢查結果
                    Write-Host "安全檢查結果："
                    Write-Host ""
                    Write-Host "✓ 儲存帳戶啟用 HTTPS"
                    Write-Host "✓ 資料庫啟用 SSL/TLS"
                    Write-Host "⚠ 未啟用 Azure Defender"
                    Write-Host "⚠ 未設定網路安全群組（NSG）規則"
                    Write-Host "✓ 啟用診斷日誌"
                    Write-Host "✓ 使用受控識別"
                    Write-Host ""
                    
                    Write-Host "建議改進："
                    Write-Host "1. 啟用 Azure Defender for App Service"
                    Write-Host "2. 設定更嚴格的 NSG 規則"
                    Write-Host "3. 啟用 Key Vault 的虛擬網路限制"
                    Write-Host "4. 實施最小權限原則（RBAC）"
                    
                } else {
                    Write-Host "未找到 IaC 模板檔案"
                }

                Write-Host ""
                Write-Host "========================================="

  - stage: SecurityReport
    displayName: "安全掃描報告"
    dependsOn: SecurityScanning
    condition: succeededOrFailed()
    jobs:
      - job: GenerateReport
        displayName: "生成安全報告"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: PowerShell@2
            displayName: "生成綜合安全報告"
            inputs:
