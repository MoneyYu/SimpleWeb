  # 變更失敗處理
  - stage: ChangeFailure
    displayName: '變更失敗處理'
    dependsOn:
      - ImplementChange
      - VerifyChange
    condition: failed()
    jobs:
      - job: HandleFailure
        displayName: '處理變更失敗'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: PowerShell@2
            displayName: '更新變更單為失敗'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "========================================="
                Write-Host "⚠ 變更失敗 - 更新變更單"
                Write-Host "========================================="
                Write-Host ""
                
                # $failureBody = @{
                #     'state' = 'Closed'
                #     'close_code' = 'unsuccessful'
                #     'close_notes' = "Deployment failed. System rolled back. Investigation required."
                #     'actual_end' = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss")
                # } | ConvertTo-Json
                
                Write-Host "變更單號: CHG0030123"
                Write-Host "狀態: Closed - Unsuccessful"
                Write-Host "失敗原因: 部署驗證失敗"
                Write-Host "已執行回滾: 是"
                Write-Host ""
                Write-Host "✓ 變更單已更新"
                
          - task: PowerShell@2
            displayName: '發送失敗通知'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "發送變更失敗通知..."
                Write-Host ""
                Write-Host "通知對象："
                Write-Host "- DevOps 團隊"
                Write-Host "- 變更審批人"
                Write-Host "- 技術主管"
                Write-Host ""
                Write-Host "通知內容："
                Write-Host "⚠ 變更 CHG0030123 執行失敗"
                Write-Host "系統已自動回滾到穩定版本"
                Write-Host "需要進行根本原因分析"

# ========================================
# 變更管理最佳實踐
# ========================================
#
# 1. 自動化標準變更
#    - 預先核准低風險變更
#    - 自動化審批流程
#    - 加快交付速度
#
# 2. 風險評估
#    - 根據變更範圍評估風險
#    - 高風險需要更嚴格審批
#    - 記錄風險緩解措施
#
# 3. 時間窗口管理
#    - 在低流量時段部署
#    - 避免在業務高峰期變更
#    - 考慮不同時區的影響
#
# 4. 完整的回滾計劃
#    - 每個變更都要有回滾計劃
#    - 測試回滾程序
#    - 明確回滾決策標準
#
# 5. 審批流程優化
#    - 實施分級審批
#    - 緊急變更快速通道
#    - 避免審批成為瓶頸
#
# 6. 持續改進
#    - 分析變更失敗原因
#    - 優化變更流程
#    - 分享經驗教訓
#
# 7. 合規性文件
#    - 保留完整審計追蹤
#    - 定期審查合規性
#    - 準備審計報告
#
# 8. 溝通與協作
#    - 及時通知相關人員
#    - 記錄變更會議決議
#    - 建立變更日曆
#
# ========================================
