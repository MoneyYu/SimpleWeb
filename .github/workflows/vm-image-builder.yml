name: Build VM Image with Azure Image Builder

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_RESOURCE_GROUP: 'rg-simpleweb-imagebuilder'
  LOCATION: 'eastus'
  IMAGE_TEMPLATE_NAME: 'simpleweb-vm-template'
  SIG_NAME: 'sig_simpleweb'
  SIG_IMAGE_DEFINITION: 'SimpleWebVM'
  USER_ASSIGNED_IDENTITY_NAME: 'simpleweb-aib-identity'
  AIB_TEMPLATE_PATH: 'image-builder/aib-template.json'

jobs:
  build-and-publish-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/SimpleWeb/SimpleWeb.csproj

      - name: Build application
        run: dotnet build src/SimpleWeb/SimpleWeb.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish src/SimpleWeb/SimpleWeb.csproj --configuration Release --output ./publish --no-build

      - name: Create deployment package
        run: |
          cd publish
          zip -r ../SimpleWeb.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleweb-package
          path: SimpleWeb.zip
          retention-days: 1

  build-vm-image:
    runs-on: ubuntu-latest
    needs: build-and-publish-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}  # Remove 'v' prefix if exists
          else
            VERSION="$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Image version: $VERSION"

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: simpleweb-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload SimpleWeb package to Azure Storage
        id: upload-package
        run: |
          # Create storage account if not exists (for artifacts)
          STORAGE_ACCOUNT_NAME="stgsimpleweb$(echo $RANDOM | md5sum | head -c 10)"
          CONTAINER_NAME="artifacts"
          
          az storage account create \
            --name $STORAGE_ACCOUNT_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku Standard_LRS \
            --allow-blob-public-access true
          
          # Create container
          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT_NAME \
            --public-access blob
          
          # Upload package
          az storage blob upload \
            --account-name $STORAGE_ACCOUNT_NAME \
            --container-name $CONTAINER_NAME \
            --name SimpleWeb.zip \
            --file SimpleWeb.zip \
            --overwrite
          
          # Get blob URL
          BLOB_URL=$(az storage blob url \
            --account-name $STORAGE_ACCOUNT_NAME \
            --container-name $CONTAINER_NAME \
            --name SimpleWeb.zip \
            --output tsv)
          
          echo "BLOB_URL=$BLOB_URL" >> $GITHUB_OUTPUT
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update Shared Image Gallery
        id: sig
        run: |
          # Create Shared Image Gallery if not exists
          if ! az sig show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --gallery-name ${{ env.SIG_NAME }} &>/dev/null; then
            az sig create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --gallery-name ${{ env.SIG_NAME }} \
              --location ${{ env.LOCATION }}
          fi
          
          # Create Image Definition if not exists
          if ! az sig image-definition show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --gallery-name ${{ env.SIG_NAME }} \
            --gallery-image-definition ${{ env.SIG_IMAGE_DEFINITION }} &>/dev/null; then
            az sig image-definition create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --gallery-name ${{ env.SIG_NAME }} \
              --gallery-image-definition ${{ env.SIG_IMAGE_DEFINITION }} \
              --publisher SimpleWeb \
              --offer SimpleWebApp \
              --sku WindowsServer2022 \
              --os-type Windows \
              --os-state Generalized \
              --hyper-v-generation V2 \
              --location ${{ env.LOCATION }}
          fi
          
          # Get Gallery Image ID
          GALLERY_IMAGE_ID=$(az sig image-definition show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --gallery-name ${{ env.SIG_NAME }} \
            --gallery-image-definition ${{ env.SIG_IMAGE_DEFINITION }} \
            --query id --output tsv)
          
          echo "GALLERY_IMAGE_ID=$GALLERY_IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Create or Get User Assigned Identity
        id: identity
        run: |
          # Create identity if not exists
          if ! az identity show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.USER_ASSIGNED_IDENTITY_NAME }} &>/dev/null; then
            az identity create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.USER_ASSIGNED_IDENTITY_NAME }} \
              --location ${{ env.LOCATION }}
            
            # Wait for identity to be fully created
            sleep 30
          fi
          
          # Get identity details
          IDENTITY_ID=$(az identity show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.USER_ASSIGNED_IDENTITY_NAME }} \
            --query id --output tsv)
          
          IDENTITY_PRINCIPAL_ID=$(az identity show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.USER_ASSIGNED_IDENTITY_NAME }} \
            --query principalId --output tsv)
          
          echo "IDENTITY_ID=$IDENTITY_ID" >> $GITHUB_OUTPUT
          echo "IDENTITY_PRINCIPAL_ID=$IDENTITY_PRINCIPAL_ID" >> $GITHUB_OUTPUT

      - name: Assign permissions to User Assigned Identity
        run: |
          # Get subscription ID
          SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          
          # Assign Contributor role on resource group
          az role assignment create \
            --assignee ${{ steps.identity.outputs.IDENTITY_PRINCIPAL_ID }} \
            --role "Contributor" \
            --scope "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}" \
            --only-show-errors || true
          
          # Wait for role assignment to propagate
          sleep 30

      - name: Prepare AIB Template
        run: |
          # Replace placeholders in template
          sed -i 's|<LOCATION>|${{ env.LOCATION }}|g' ${{ env.AIB_TEMPLATE_PATH }}
          sed -i 's|<USER_ASSIGNED_IDENTITY_RESOURCE_ID>|${{ steps.identity.outputs.IDENTITY_ID }}|g' ${{ env.AIB_TEMPLATE_PATH }}
          sed -i 's|<ARTIFACT_STORAGE_URL>|${{ steps.upload-package.outputs.BLOB_URL }}|g' ${{ env.AIB_TEMPLATE_PATH }}
          sed -i 's|<SHARED_IMAGE_GALLERY_IMAGE_ID>|${{ steps.sig.outputs.GALLERY_IMAGE_ID }}|g' ${{ env.AIB_TEMPLATE_PATH }}
          sed -i 's|<REGION>|${{ env.LOCATION }}|g' ${{ env.AIB_TEMPLATE_PATH }}
          
          cat ${{ env.AIB_TEMPLATE_PATH }}

      - name: Create Image Template
        run: |
          # Delete existing template if exists
          az image builder show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_TEMPLATE_NAME }} &>/dev/null && \
          az image builder delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_TEMPLATE_NAME }} \
            --yes || true
          
          # Create new template
          az image builder create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_TEMPLATE_NAME }} \
            --image-template ${{ env.AIB_TEMPLATE_PATH }} \
            --tags version="${{ steps.version.outputs.VERSION }}" buildDate="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Build Image
        run: |
          # Start the image build
          az image builder run \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_TEMPLATE_NAME }}
          
          echo "Image build started. This may take 30-60 minutes..."

      - name: Monitor Image Build
        run: |
          # Monitor the build status
          MAX_ATTEMPTS=60
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(az image builder show \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.IMAGE_TEMPLATE_NAME }} \
              --query lastRunStatus.runState --output tsv)
            
            echo "Build status: $STATUS (Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"
            
            if [ "$STATUS" = "Succeeded" ]; then
              echo "✅ Image build completed successfully!"
              
              # Get the latest version
              LATEST_VERSION=$(az sig image-version list \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --gallery-name ${{ env.SIG_NAME }} \
                --gallery-image-definition ${{ env.SIG_IMAGE_DEFINITION }} \
                --query "[0].name" --output tsv)
              
              echo "Latest image version: $LATEST_VERSION"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Image build failed!"
              
              # Get error details
              az image builder show \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --name ${{ env.IMAGE_TEMPLATE_NAME }} \
                --query lastRunStatus
              
              exit 1
            fi
            
            sleep 60
            ATTEMPT=$((ATTEMPT+1))
          done
          
          echo "⚠️ Build monitoring timed out after $MAX_ATTEMPTS minutes"
          exit 1

      - name: Cleanup Temporary Storage
        if: always()
        run: |
          # Optional: Clean up the storage account used for artifacts
          if [ -n "${{ steps.upload-package.outputs.STORAGE_ACCOUNT_NAME }}" ]; then
            echo "Keeping storage account for future builds: ${{ steps.upload-package.outputs.STORAGE_ACCOUNT_NAME }}"
            # Uncomment to delete:
            # az storage account delete \
            #   --name ${{ steps.upload-package.outputs.STORAGE_ACCOUNT_NAME }} \
            #   --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            #   --yes
          fi

      - name: Summary
        if: success()
        run: |
          echo "## 🎉 VM Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ SimpleWeb VM Image has been successfully created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Shared Image Gallery**: ${{ env.SIG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Definition**: ${{ env.SIG_IMAGE_DEFINITION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: ${{ env.LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What's Included" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Server 2022 Datacenter" >> $GITHUB_STEP_SUMMARY
          echo "- IIS with Management Tools" >> $GITHUB_STEP_SUMMARY
          echo "- .NET 10 Hosting Bundle" >> $GITHUB_STEP_SUMMARY
          echo "- SimpleWeb Application" >> $GITHUB_STEP_SUMMARY
